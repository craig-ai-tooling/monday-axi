name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check (monday-axi is stdlib-only, no install step needed)
        run: python3 -m compileall monday_axi

      - name: Lint (ruff, if available)
        run: |
          if command -v ruff >/dev/null 2>&1 || python3 -m pip install --quiet ruff; then
            ruff check .
          else
            echo "ruff unavailable, skipping lint"
          fi

      - name: Unit tests (if any exist)
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s tests -v
          else
            echo "no tests/ present, skipping"
          fi

      - name: --help smoke test (no network, no credentials required)
        run: |
          python3 -m monday_axi --help
          for verb in board mine items dupes put create delete apply whoami doctor; do
            python3 -m monday_axi "$verb" --help
          done
