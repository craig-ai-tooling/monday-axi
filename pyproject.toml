[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monday-axi"
version = "0.1.0"
description = "Agent-ergonomic CLI over the monday.com SA Weekly Activity Board."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib only — argparse, json, subprocess, urllib

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
monday-axi = "monday_axi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["monday_axi"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E9 = syntax errors, F = pyflakes (unused imports/vars, undefined names).
# The terse semicolon/one-line style is deliberate for a small CLI, so E7 is off.
select = ["E9", "F"]
